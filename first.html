<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First HTML</title>
    <style>
        /* Custom CSS Reset */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            -webkit-text-size-adjust: 100%;
            -moz-text-size-adjust: 100%;
            text-size-adjust: 100%;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            min-height: 100vh;
            line-height: 1.5;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        img,
        picture,
        video,
        canvas,
        svg {
            display: block;
            max-width: 100%;
        }

        input,
        button,
        textarea,
        select {
            font: inherit;
        }

        p,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            overflow-wrap: break-word;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        ul[role="list"],
        ol[role="list"] {
            list-style: none;
        }

        /* Hero Section */
        .hero {
            position: relative;
            min-height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #ffffff;
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
                url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1920&q=80");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 2rem 1.5rem;
        }

        .hero__content {
            max-width: 48rem;
        }

        .hero__title {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 1rem;
        }

        .hero__description {
            font-size: clamp(1rem, 2.5vw, 1.25rem);
            line-height: 1.6;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <section class="hero">
        <div class="hero__content">
            <h1 class="hero__title">First World!!!</h1>
            <p class="hero__description">This is feature 1 — a modern, responsive hero section with a banner image, title, and description.</p>
        </div>
    </section>
    <p>This Maga</p>
</body>
</html>
